<svg
        xmlns="http://www.w3.org/2000/svg"
        width="900"
        height="500"
        viewBox="0 0 900 500"
        role="img"
        aria-label="MobillsInMobild Terminal"
    >

    <style>
        .bg {
            fill: #070b11;
        }

        .panel {
            fill: #0d1117;
            stroke: #30363d;
            stroke-width: 1;
        }

        .green {
            fill: #39ff88;
            font-family: ui-monospace, SFMono-Regular,
                         Menlo, Monaco, Consolas,
                         "Liberation Mono", monospace;
        }

        .cyan {
            fill: #58d7ff;
            font-family: ui-monospace, SFMono-Regular,
                         Menlo, Monaco, Consolas,
                         "Liberation Mono", monospace;
        }

        .primary {
            fill: #e6edf3;
            font-family: ui-monospace, SFMono-Regular,
                         Menlo, Monaco, Consolas,
                         "Liberation Mono", monospace;
        }

        .secondary {
            fill: #8b949e;
            font-family: ui-monospace, SFMono-Regular,
                         Menlo, Monaco, Consolas,
                         "Liberation Mono", monospace;
        }

        .title {
            font-size: 25px;
            font-weight: 700;
        }

        .normal {
            font-size: 15px;
        }

        .small {
            font-size: 12px;
        }

        .cursor {
            animation: blink 1s steps(2, start) infinite;
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }
    </style>

