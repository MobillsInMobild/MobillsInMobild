name: Generate Profile Terminal

on:
  schedule:
    - cron: "0 19 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate_terminal.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate terminal SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/generate_terminal.py

      - name: Commit generated SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add assets/terminal.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile terminal"
            git push
          fi
